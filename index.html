<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nata ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #09070c;
            --text: #f5f2f7;
            --muted: #8c8296;
            --accent: #ff8fa3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* М'яке тепле світло на фоні */
        .ambient {
            position: absolute;
            width: 650px;
            height: 650px;
            background: radial-gradient(circle, rgba(255, 143, 163, 0.07) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px;
            max-width: 720px;
        }

        .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--muted);
            margin-bottom: 25px;
            font-weight: 400;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(2.2rem, 5vw, 4.2rem);
            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1.25;
            margin-bottom: 30px;
            color: #ffffff;
        }

        h1 span {
            color: var(--accent);
            font-weight: 800;
        }

        .interactive-box {
            display: inline-block;
            padding: 15px 34px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 143, 163, 0.25);
            border-radius: 100px;
            font-size: 0.95rem;
            font-weight: 400;
            color: var(--text);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px);
        }

        .interactive-box:hover {
            background: rgba(255, 143, 163, 0.08);
            border-color: rgba(255, 143, 163, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 143, 163, 0.1);
        }

        .interactive-box:active {
            transform: translateY(0);
        }

        /* Повідомлення, що з'являється */
        .message-box {
            margin-top: 35px;
            font-size: 1.25rem;
            color: var(--accent);
            line-height: 1.6;
            font-weight: 500;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 0;
            overflow: hidden;
            text-shadow: 0 0 20px rgba(255, 143, 163, 0.3);
        }

        .message-box.visible {
            opacity: 1;
            transform: translateY(0);
            max-height: 200px;
        }

        /* Мінімалістичний кастомний курсор */
        .cursor {
            position: fixed;
            width: 16px;
            height: 16px;
            border: 1px solid rgba(255, 143, 163, 0.5);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background 0.2s;
            z-index: 9999;
            display: none;
        }

        /* Мікро-частинки при кліку */
        .click-spark {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            font-size: 14px;
            animation: sparkFade 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes sparkFade {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(0.3); }
        }

        @media (min-width: 768px) {
            .cursor { display: block; }
            body { cursor: none; }
            .interactive-box { cursor: none; }
        }
    </style>
</head>
<body>

    <div class="ambient"></div>
    <div class="cursor" id="cursor"></div>

    <div class="container">
        <div class="label">Важлива інформація</div>
        <h1>Зайнятий королевою, є любима <span>Наточка</span></h1>
        
        <div class="interactive-box" id="actionBtn">Відкрити ✨</div>
        
        <div class="message-box" id="msgBox">
            Люблю тебе сильно, Наточка) ❤️
        </div>
    </div>

    <script>
        // Кастомний плавний курсор
        const cursor = document.getElementById('cursor');
        window.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        const btn = document.getElementById('actionBtn');
        btn.addEventListener('mouseenter', () => {
            cursor.style.width = '36px';
            cursor.style.height = '36px';
            cursor.style.background = 'rgba(255, 143, 163, 0.08)';
        });
        btn.addEventListener('mouseleave', () => {
            cursor.style.width = '16px';
            cursor.style.height = '16px';
            cursor.style.background = 'transparent';
        });

        // Поява тексту та акуратного ефекту по кліку
        const msgBox = document.getElementById('msgBox');
        let opened = false;

        btn.addEventListener('click', (e) => {
            if (!opened) {
                opened = true;
                msgBox.classList.add('visible');
                btn.style.opacity = '0.4';
                btn.style.pointerEvents = 'none';
                btn.innerText = 'Назавжди';
            }

            // Легкий та акуратний спалах часток
            const sparks = ['✨', '🌸', '❤️'];
            for (let i = 0; i < 12; i++) {
                const spark = document.createElement('div');
                spark.className = 'click-spark';
                spark.innerText = sparks[Math.floor(Math.random() * sparks.length)];
                
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 80 + 30;

                spark.style.left = e.clientX + 'px';
                spark.style.top = e.clientY + 'px';
                spark.style.setProperty('--x', `${Math.cos(angle) * dist}px`);
                spark.style.setProperty('--y', `${Math.sin(angle) * dist}px`);

                document.body.appendChild(spark);
                setTimeout(() => spark.remove(), 900);
            }
        });
    </script>
</body>
</html>
